name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.3"
  EXPORT_NAME: "Trash-PC-Tycoon"
  PROJECT_PATH: "."

jobs:
  export-android:
    name: Export Android APK (Godot 4.3, C#)
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:mono-4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Show toolchain (diagnostics)
        continue-on-error: true
        run: |
          echo "PATH=$PATH"
          which godot || true
          ls /usr/local/bin || true
          godot --version || true
          dotnet --version || true
          java -version || true
          echo "ANDROID_HOME=${ANDROID_HOME:-unset} ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"

      - name: Install .NET 8 SDK (container image has none)
        run: |
          curl -sSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh             || wget -q https://dot.net/v1/dotnet-install.sh -O /tmp/dotnet-install.sh
          bash /tmp/dotnet-install.sh --channel 8.0 --install-dir "$HOME/.dotnet"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"
          "$HOME/.dotnet/dotnet" --version

      - name: Fix .NET root for Godot (hostfxr)
        run: |
          echo "dotnet: $(which dotnet || echo missing) -> $(readlink -f "$(which dotnet)" 2>/dev/null || echo '?')"
          FXR="$(find / -type d -path '*/host/fxr' 2>/dev/null | head -n 1 || true)"
          echo "host/fxr found at: ${FXR:-none}"
          if [ -n "$FXR" ]; then
            DOTNET_ROOT_FIXED="$(dirname "$(dirname "$FXR")")"
            echo "Setting DOTNET_ROOT=$DOTNET_ROOT_FIXED"
            echo "DOTNET_ROOT=$DOTNET_ROOT_FIXED" >> "$GITHUB_ENV"
          fi
          {
            echo "dotnet=$(which dotnet || echo missing)"
            echo "dotnet_real=$(readlink -f "$(which dotnet)" 2>/dev/null || echo '?')"
            echo "fxr=${FXR:-none}"
            echo "ls_usr_share_dotnet=$(ls /usr/share/dotnet 2>/dev/null | tr '\n' ' ')"
            echo "ls_dotnet_host=$(ls /usr/share/dotnet/host 2>/dev/null | tr '\n' ' ')"
            echo "env_DOTNET_ROOT=${DOTNET_ROOT:-unset}"
            dotnet --list-runtimes 2>&1 | head -n 5
          } > "$GITHUB_WORKSPACE/dotnet-diag.txt" 2>&1 || true
          msg="$(sed 's/%/%25/g; s/\r/%0D/g' "$GITHUB_WORKSPACE/dotnet-diag.txt" | awk '{printf "%s%%0A", $0}')"
          echo "::error file=dotnetdiag.txt,title=dotnetdiag::$msg"

      - name: Setup export templates
        run: |
          DEST="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono"
          mkdir -p "$DEST"
          FOUND="$(find / -type d -name "${GODOT_VERSION}.stable.mono" -path "*export_templates*" 2>/dev/null | head -n 1 || true)"
          if [ -n "$FOUND" ] && [ "$FOUND" != "$DEST" ]; then
            cp -r "$FOUND/." "$DEST/"
          fi
          ls "$DEST"

      - name: Regenerate pixel app icon (Pillow)
        continue-on-error: true
        run: |
          python3 -m pip install --quiet pillow \
            && python3 Tools/generate_icon.py \
            || echo "Icon regeneration skipped - using committed icon.png / android_icons"

      - name: Import project
        run: |
          cd "$PROJECT_PATH"
          {
            echo "=== which ==="
            which godot dotnet java 2>&1 || true
            echo "=== versions ==="
            godot --version 2>&1 || true
            dotnet --version 2>&1 || true
            java -version 2>&1 || true
            echo "=== env ==="
            echo "ANDROID_HOME=${ANDROID_HOME:-unset} ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset} HOME=$HOME"
            echo "=== dotnet build ==="
            dotnet build Mira.csproj -v minimal 2>&1 || true
            echo "=== godot import ==="
            godot --headless --verbose --import 2>&1
            echo "IMPORT_EXIT=$?"
          } | tee "$GITHUB_WORKSPACE/ci-import.log"
          grep -q "IMPORT_EXIT=0" "$GITHUB_WORKSPACE/ci-import.log"

      - name: Upload CI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: ci-import.log
          if-no-files-found: ignore

      - name: Export Android APK (debug)
        run: |
          cd "$PROJECT_PATH"
          mkdir -p build
          set +e
          godot --headless --verbose --export-debug "Android" "build/${EXPORT_NAME}.apk" > "$GITHUB_WORKSPACE/ci-export.log" 2>&1
          code=$?
          echo "EXPORT_EXIT=$code" | tee -a "$GITHUB_WORKSPACE/ci-export.log"
          i=0
          grep -E "ERROR|error|Exception|EXPORT_EXIT" "$GITHUB_WORKSPACE/ci-export.log" | head -n 9 | while IFS= read -r line; do
            i=$((i+1))
            safe="$(printf '%s' "$line" | sed 's/%/%25/g; s/\r/%0D/g')"
            echo "::error file=export$i.txt,title=export::$safe"
          done
          msg="$(tail -n 30 "$GITHUB_WORKSPACE/ci-export.log" | sed 's/%/%25/g; s/\r/%0D/g' | awk '{printf "%s%%0A", $0}')"
          echo "::error file=exporttail.txt,title=exporttail::$msg"
          ls -lh build/
          exit $code

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trash-PC-Tycoon-debug-apk
          path: build/*.apk
          if-no-files-found: error
