name: Build Pocket Bunker APK

on:
  push:
    branches: [ main, "arena/*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK (Godot headless)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Android SDK requirement)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Install Android command-line tools & dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget unzip curl libgl1 mesa-utils xvfb
          # Android SDK command-line tools
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip
          mv cmdline-tools latest
          cd ..
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Download Godot 4.2.2 headless
        id: get-godot
        run: |
          GODOT_VERSION=4.2.2
          GODOT_URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux_headless.64.zip"
          cd $RUNNER_TEMP
          wget -q "$GODOT_URL" -O godot.zip
          unzip -q godot.zip
          chmod +x Godot_v${GODOT_VERSION}-stable_linux_headless.64
          echo "GODOT_BIN=$RUNNER_TEMP/Godot_v${GODOT_VERSION}-stable_linux_headless.64" >> $GITHUB_OUTPUT

      - name: Download Godot export templates (Android)
        run: |
          GODOT_VERSION=4.2.2
          cd $RUNNER_TEMP
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export.tpz" -O export.tpz
          mkdir -p ~/.local/share/godot/export_templates/
          unzip -q export.tpz -d ~/.local/share/godot/export_templates/
          mv ~/.local/share/godot/export_templates/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.custom 2>/dev/null || true

      - name: Export Android APK
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          mkdir -p build
          # Используем xvfb для headless рендеринга (нужен для экспорта ресурсов)
          xvfb-run -a ${{ steps.get-godot.outputs.GODOT_BIN }} \
            --headless \
            --export-release "Android" build/PocketBunker.apk \
            --quit-on-finish

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketBunker-APK
          path: build/PocketBunker.apk
          retention-days: 7
