name: Build Pocket Bunker (Windows EXE)

on:
  push:
    branches: [ main, "arena/*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows EXE (Godot headless)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget unzip curl xvfb libgl1

      - name: Download Godot 4.2.2 Linux
        id: get-godot
        run: |
          GODOT_VERSION=4.2.2
          cd $RUNNER_TEMP
          gh release download ${GODOT_VERSION}-stable -p "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" --repo godotengine/godot --clobber
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          chmod +x Godot_v${GODOT_VERSION}-stable_linux.x86_64
          echo "GODOT_BIN=$RUNNER_TEMP/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> $GITHUB_OUTPUT

      - name: Download Godot export templates (Windows)
        run: |
          GODOT_VERSION=4.2.2
          cd $RUNNER_TEMP
          gh release download ${GODOT_VERSION}-stable -p "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" --repo godotengine/godot --clobber
          mkdir -p export_templates_tmp
          unzip -o Godot_v${GODOT_VERSION}-stable_export_templates.tpz -d export_templates_tmp/
          mkdir -p ~/.local/share/godot/export_templates/
          cp export_templates_tmp/templates/${GODOT_VERSION}.stable/windows_debug.exe \
             ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.windows_debug.exe
          cp export_templates_tmp/templates/${GODOT_VERSION}.stable/windows_release.exe \
             ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.windows_release.exe
          echo "=== Installed templates ==="
          ls -la ~/.local/share/godot/export_templates/

      - name: Configure Godot for Windows export
        run: |
          mkdir -p ~/.config/godot
          echo '[gd_resource type="EditorSettings" format=3 uid="win-export-config"]' > ~/.config/godot/editor_settings-4.2.2.tres
          echo '' >> ~/.config/godot/editor_settings-4.2.2.tres
          echo '[resource]' >> ~/.config/godot/editor_settings-4.2.2.tres

      - name: Export Windows EXE
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p build
          ${{ steps.get-godot.outputs.GODOT_BIN }} \
            --headless \
            --path "$GITHUB_WORKSPACE" \
            --export-release "Windows Desktop" \
            "build/PocketBunker.exe" \
            --quit-on-finish
          echo "=== Build dir ==="
          ls -la build/ 2>/dev/null || echo "no build dir"
          echo "=== All EXE files ==="
          find . -name "*.exe" 2>/dev/null || echo "no exe"

      - name: Upload EXE artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PocketBunker-Windows-EXE
          path: build/PocketBunker.exe
          retention-days: 7
