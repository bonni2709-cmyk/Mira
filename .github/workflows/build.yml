name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.3"
  EXPORT_NAME: "Trash-PC-Tycoon"
  PROJECT_PATH: "."

jobs:
  export-android:
    name: Export Android APK (Godot 4.3, C#)
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:mono-4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Show toolchain (diagnostics)
        continue-on-error: true
        run: |
          echo "PATH=$PATH"
          which godot || true
          ls /usr/local/bin || true
          godot --version || true
          dotnet --version || true
          java -version || true
          echo "ANDROID_HOME=${ANDROID_HOME:-unset} ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"

      - name: Setup export templates
        run: |
          DEST="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono"
          mkdir -p "$DEST"
          FOUND="$(find / -type d -name "${GODOT_VERSION}.stable.mono" -path "*export_templates*" 2>/dev/null | head -n 1 || true)"
          if [ -n "$FOUND" ] && [ "$FOUND" != "$DEST" ]; then
            cp -r "$FOUND/." "$DEST/"
          fi
          ls "$DEST"

      - name: Regenerate pixel app icon (Pillow)
        continue-on-error: true
        run: |
          python3 -m pip install --quiet pillow \
            && python3 Tools/generate_icon.py \
            || echo "Icon regeneration skipped - using committed icon.png / android_icons"

      - name: Import project
        run: |
          cd "$PROJECT_PATH"
          {
            echo "=== which ==="
            which godot dotnet java 2>&1 || true
            echo "=== versions ==="
            godot --version 2>&1 || true
            dotnet --version 2>&1 || true
            java -version 2>&1 || true
            echo "=== env ==="
            echo "ANDROID_HOME=${ANDROID_HOME:-unset} ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset} HOME=$HOME"
            echo "=== dotnet build ==="
            dotnet build Mira.csproj -v minimal 2>&1 || true
            echo "=== godot import ==="
            godot --headless --verbose --import 2>&1
            echo "IMPORT_EXIT=$?"
          } | tee "$GITHUB_WORKSPACE/ci-import.log"
          test -f .godot/global_script_class_cache.cfg || test -d .godot

      - name: Upload CI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: ci-import.log
          if-no-files-found: ignore

      - name: Export Android APK (debug)
        run: |
          cd "$PROJECT_PATH"
          mkdir -p build
          godot --headless --verbose --export-debug "Android" "build/${EXPORT_NAME}.apk"
          ls -lh build/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trash-PC-Tycoon-debug-apk
          path: build/*.apk
          if-no-files-found: error
