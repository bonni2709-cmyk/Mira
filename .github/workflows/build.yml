name: Build Pocket Bunker APK

on:
  push:
    branches: [ main, "arena/*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK (Godot headless)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Android SDK requirement)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Install Android command-line tools & dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget unzip curl libgl1 mesa-utils xvfb
          # Android SDK command-line tools
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip
          mv cmdline-tools latest
          cd ..
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Download Godot 4.2.2 Linux
        id: get-godot
        run: |
          GODOT_VERSION=4.2.2
          GODOT_URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          cd $RUNNER_TEMP
          wget -q "$GODOT_URL" -O godot.zip
          unzip -q godot.zip
          chmod +x Godot_v${GODOT_VERSION}-stable_linux.x86_64
          echo "GODOT_BIN=$RUNNER_TEMP/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> $GITHUB_OUTPUT

      - name: Download Godot export templates (Android)
        run: |
          GODOT_VERSION=4.2.2
          cd $RUNNER_TEMP
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O export.tpz
          mkdir -p ~/.local/share/godot/export_templates/
          unzip -o export.tpz -d ~/.local/share/godot/export_templates/
          # Сдвинуть шаблоны на уровень выше если они в подпапке templates/
          if [ -d ~/.local/share/godot/export_templates/templates ]; then
            cp -r ~/.local/share/godot/export_templates/templates/* ~/.local/share/godot/export_templates/ 2>/dev/null || true
          fi
          echo "=== Extracted templates ==="
          ls -laR ~/.local/share/godot/export_templates/

      - name: Configure Godot for Android export
        run: |
          mkdir -p ~/.config/godot ~/.android
          echo '[gd_resource type="EditorSettings" format=3 uid="android-export-config"]' > ~/.config/godot/editor_settings-4.2.2.tres
          echo '' >> ~/.config/godot/editor_settings-4.2.2.tres
          echo '[resource]' >> ~/.config/godot/editor_settings-4.2.2.tres
          echo '' >> ~/.config/godot/editor_settings-4.2.2.tres
          echo "/android/custom_path = \"${HOME}/android-sdk\"" >> ~/.config/godot/editor_settings-4.2.2.tres
          echo "/android/debug_keystore_path = \"${HOME}/.android/debug.keystore\"" >> ~/.config/godot/editor_settings-4.2.2.tres
          keytool -genkey -v -keystore "${HOME}/.android/debug.keystore" -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null || true

      - name: Debug environment before export
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          echo "=== Godot binary ==="
          ls -la ${{ steps.get-godot.outputs.GODOT_BIN }}
          echo "=== Export templates ==="
          ls -laR ~/.local/share/godot/export_templates/ 2>/dev/null || echo "no templates dir"
          echo "=== Android SDK ==="
          ls -la $ANDROID_SDK_ROOT
          echo "=== Platform tools ==="
          ls -la $ANDROID_SDK_ROOT/platform-tools 2>/dev/null || echo "no platform-tools"
          echo "=== Preset file ==="
          cat .export_presets.cfg
          echo "=== Project files ==="
          ls -la

      - name: Verify export templates before build
        run: |
          echo "=== Templates available ==="
          ls -la ~/.local/share/godot/export_templates/ 2>/dev/null || echo "no templates"
          file ~/.local/share/godot/export_templates/*.apk 2>/dev/null || echo "no apk files found"

      - name: Export Android APK
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p build
          # Godot headless экспорт (использует export_path из пресета)
          ${{ steps.get-godot.outputs.GODOT_BIN }} \
            --headless \
            --path "$GITHUB_WORKSPACE" \
            --export-debug "Android"
          echo "Exit code: $?"
          echo "=== Build directory contents ==="
          ls -la build/ 2>/dev/null || echo "build dir empty or missing"
          echo "=== All APK files in workspace ==="
          find . -name "*.apk" -type f 2>/dev/null || echo "no apk files found"

      - name: Upload Godot export log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Godot-Export-Log
          path: godot_export.log
          retention-days: 7

      - name: Upload all APK files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: All-APK-Files
          path: "**/*.apk"
          retention-days: 7

      - name: Upload APK artifact (specific)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PocketBunker-APK
          path: build/PocketBunker.apk
          retention-days: 7
